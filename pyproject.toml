[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwel"
version = "0.3.0"
description = "Budget-aware active perception for sub-billion-parameter vision-language models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Theophile Avenel" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "psutil>=5.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
model = [
    "torch>=2.2",
    "transformers>=4.49,<5",
    "accelerate>=0.30",
]
ocr = ["pytesseract>=0.3.10"]
data = [
    "datasets>=2.19,<4",
    "pandas>=2.0",
    "pyarrow>=15,<19",
]
gpu = ["pynvml>=11.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
