# A third workload, and the one where the serving model reads best.
#
# The two-regime claim has asymmetric support: the negative half (a free image
# descriptor stops working once the between-domain axis is removed) is measured
# on two workloads, while the positive half (a model-read signal on a graded
# action space clears the randomisation hull) is strong on DocVQA and marginal
# on InfographicVQA, where the model answers only 0.368 of the corpus at its
# ceiling and most queries are unanswerable at any rung.
#
# ChartQA separates the two explanations. It is a third workload, it is not
# document scans, and the serving model reads charts far better than
# infographics, so if the ladder clears the hull here the positive half rests
# on model strength rather than on DocVQA.
#
# Scored with relaxed accuracy, the metric the benchmark defines: a numeric
# answer within 5% of the gold value, exact match otherwise. Grading chart
# answers with ANLS would award partial credit for edit-distance proximity to a
# different number.

model:
  model_id: HuggingFaceTB/SmolVLM-500M-Instruct
  device: auto
  dtype: bfloat16
  max_new_tokens: 16
  answer_prompt: "Answer with a single word or short phrase."

paths:
  data_dir: data
  pilot_dir: data/processed/chartqa500
  pilot_manifest: data/processed/chartqa500/manifest.jsonl
  records: results/runs/chartqa500_records.jsonl
  labels: results/runs/chartqa500_labels.jsonl
  router_dir: results/router-chartqa500

runner:
  lowres_sizes: [384, 768, 1152]
  full_longest_side: 2048
  # The resolution ladder only; crops and OCR are not read by this study.
  include_crop: false
  include_ocr: false
  crop:
    rows: 2
    cols: 2
    overlap: 0.2
    longest_side: 512
    preview_size: 256
  ocr:
    backend: pytesseract
    source: full
    source_longest_side: 768
    regions: false
    region_longest_side: 768
    preview_size: 256
  repeats: 1
  warmup: 0
  include_no_image: true
  include_full: true

profiling:
  energy_backends: auto
  sample_interval_ms: 20
  nvml_device_index: 0
  hardware_repeats: 1
  hardware_warmup: 0

cost:
  error_weight: 1.0
  lambda_latency_per_ms: 0.00005
  lambda_energy_per_mj: 0.000002
  lambda_memory_per_mb: 0.0
  lambda_visual_tokens: 0.0001

router:
  feature_config_id: lowres_384
  hidden_dims: [128, 64]
  dropout: 0.1
  lr: 0.001
  epochs: 120
  batch_size: 32
  val_fraction: 0.2
  seed: 1234

datasets:
  seed: 1234
  shuffle_buffer_size: 5000
  image_dir: data/processed/chartqa500/images
  per_dataset:
    chartqa: 500
