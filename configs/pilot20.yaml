# Balanced 20-example pilot: 5 examples per question regime.
# Validates all four dataset loaders and the oracle action distribution
# before scaling to the full pilot (configs/default.yaml).

model:
  model_id: HuggingFaceTB/SmolVLM-500M-Instruct
  device: auto
  dtype: bfloat16
  max_new_tokens: 16
  answer_prompt: "Answer with a single word or short phrase."

paths:
  data_dir: data
  pilot_dir: data/processed/pilot20
  pilot_manifest: data/processed/pilot20/manifest.jsonl
  records: results/runs/pilot20_records.jsonl
  labels: results/runs/pilot20_labels.jsonl
  router_dir: results/router-pilot20

runner:
  lowres_sizes: [384, 768]
  full_longest_side: 1536
  crop:
    rows: 2
    cols: 2
    overlap: 0.2
    longest_side: 512
    preview_size: 256
  ocr:
    backend: pytesseract
    source: full
    source_longest_side: 768
    regions: true
    region_longest_side: 768
    preview_size: 256
  repeats: 1
  warmup: 0
  include_no_image: true
  include_full: true

profiling:
  energy_backends: auto
  sample_interval_ms: 20
  nvml_device_index: 0
  hardware_repeats: 3
  hardware_warmup: 1

cost:
  error_weight: 1.0
  lambda_latency_per_ms: 0.00005   # 600 ms pass ~ 0.03
  lambda_energy_per_mj: 0.000002   # 30 J net ~ 0.06
  lambda_memory_per_mb: 0.0
  lambda_visual_tokens: 0.0001     # 922 tokens ~ 0.09

router:
  feature_config_id: lowres_384
  hidden_dims: [64, 32]
  dropout: 0.1
  lr: 0.001
  epochs: 30
  batch_size: 8
  val_fraction: 0.2
  seed: 1234

datasets:
  seed: 1234
  shuffle_buffer_size: 200   # small buffer keeps the streamed download light
  image_dir: data/processed/pilot20/images
  per_dataset:
    vqav2: 5
    textvqa: 5
    docvqa: 5
    vstar: 5
