# The fourth workload on the steeply priced model, which is the pairing that
# actually tests the scope objection.
#
# configs/textvqa500.yaml explains why a non-document corpus matters. Running it
# on one model would only add a ninth point to a picture already dominated by
# SmolVLM. The two-regime claim has two halves and they are carried by different
# model families: the free descriptor's collapse is measured wherever the
# between-domain axis is removed, and its *policy* clears only where the serving
# model prices resolution steeply. LLaVA-OneVision is the steep end of that axis
# on DocVQA at 77x, against SmolVLM-500M's 2.3x, so running both here puts the
# fourth corpus at both extremes rather than at one.
#
# If the free descriptor clears on this pair and not on the SmolVLM one, the
# price relationship of Fig. 14 extends to a corpus it was never fitted on. If
# it clears on neither, or on both, that relationship is corpus-dependent and we
# would have to say so.
#
# The ladder is capped at 1152 px for the same reason as the DocVQA variant: at
# 2048 px this model spends about 70 s and 7300 visual tokens per query, which
# is many hours for one rung. The rungs below are already distinct.

model:
  model_id: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
  device: auto
  dtype: bfloat16
  max_new_tokens: 16
  answer_prompt: "Answer with a single word or short phrase."

paths:
  data_dir: data
  pilot_dir: data/processed/textvqa500
  pilot_manifest: data/processed/textvqa500/manifest.jsonl
  records: results/runs/textvqa500_llavaov_records.jsonl
  labels: results/runs/textvqa500_llavaov_labels.jsonl
  router_dir: results/router-textvqa500-llavaov

runner:
  lowres_sizes: [384, 768]
  full_longest_side: 1152
  include_crop: false
  include_ocr: false
  crop:
    rows: 2
    cols: 2
    overlap: 0.2
    longest_side: 512
    preview_size: 256
  ocr:
    backend: pytesseract
    source: full
    source_longest_side: 768
    regions: false
    region_longest_side: 768
    preview_size: 256
  repeats: 1
  warmup: 0
  include_no_image: false
  include_full: true

profiling:
  energy_backends: auto
  sample_interval_ms: 20
  nvml_device_index: 0
  hardware_repeats: 1
  hardware_warmup: 0

cost:
  error_weight: 1.0
  lambda_latency_per_ms: 0.00005
  lambda_energy_per_mj: 0.000002
  lambda_memory_per_mb: 0.0
  lambda_visual_tokens: 0.0001

router:
  feature_config_id: lowres_384
  hidden_dims: [128, 64]
  dropout: 0.1
  lr: 0.001
  epochs: 120
  batch_size: 32
  val_fraction: 0.2
  seed: 1234

datasets:
  seed: 1234
  shuffle_buffer_size: 5000
  image_dir: data/processed/textvqa500/images
  per_dataset:
    textvqa: 500
