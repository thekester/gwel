# Pixels against tokens, with the token budget nailed shut.
#
# InternVL3-1B is 0.94B parameters: an InternViT-300M encoder with dynamic
# tiling (448 px tiles) and a Qwen2.5-0.5B language model. Nothing is shared
# with SmolVLM (SigLIP, pixel-shuffle, SmolLM2) or with Qwen2-VL's NaViT-style
# proportional patching.
#
# This config does NOT measure a cost ladder. InternVL's tiling reads the
# aspect ratio far more than the resolution: a page downsampled to 384 px on
# its longest edge is usually upscaled again to fill the same 12 tiles plus
# thumbnail as the 2048 px original.
#
# The smoke test suggested this was exact and it is not, which is worth
# recording because it is the same mistake this project keeps making. On one
# page all four rungs gave pixel_values (13, 3, 448, 448), 3328 tokens. On the
# corpus, all four rungs are token-identical on 94% of pages, every rung has
# median 3328, and the mean spend rises from 3117 to 3216 across the ladder, a
# 3% spread against a 5.3x spread in input pixels. Near-constant, not constant:
# any claim built on this config has to be stated at that strength.
#
# That makes this model the control the resolution claim never had. Everywhere
# else in the paper, pixels and visual tokens move together, so "more pixels
# stop helping" and "more tokens stop helping" cannot be told apart from the
# accuracy curve alone. Here the token budget is constant by construction and
# only the pixel information varies. If accuracy still climbs to 1152 px and
# then flattens, the ceiling is legibility of the corpus, measured with
# sequence length held fixed. If accuracy is flat across all four rungs
# instead, the earlier ladders were measuring their token budgets and the
# paper's reading has to change.
#
# crop_to_patches is load-bearing: the HF default sends one 448 px tile, which
# would discard most of every page before the question is asked.

model:
  model_id: OpenGVLab/InternVL3-1B-hf
  device: auto
  dtype: bfloat16
  max_new_tokens: 16
  answer_prompt: "Answer with a single word or short phrase."
  image_processor_overrides:
    crop_to_patches: true

paths:
  data_dir: data
  pilot_dir: data/processed/docvqa1200
  pilot_manifest: data/processed/docvqa1200/manifest.jsonl
  records: results/runs/docvqa1200_internvl1b_records.jsonl
  labels: results/runs/docvqa1200_internvl1b_labels.jsonl
  router_dir: results/router-docvqa1200-internvl1b

runner:
  lowres_sizes: [384, 768, 1152]
  full_longest_side: 2048
  # This study reads the resolution ladder only.
  include_crop: false
  include_ocr: false
  crop:
    rows: 2
    cols: 2
    overlap: 0.2
    longest_side: 512
    preview_size: 256
  ocr:
    backend: pytesseract
    source: full
    source_longest_side: 768
    regions: false
    region_longest_side: 768
    preview_size: 256
  repeats: 1
  warmup: 0
  include_no_image: true
  include_full: true

profiling:
  energy_backends: auto
  sample_interval_ms: 20
  nvml_device_index: 0
  hardware_repeats: 1
  hardware_warmup: 0

cost:
  error_weight: 1.0
  lambda_latency_per_ms: 0.00005
  lambda_energy_per_mj: 0.000002
  lambda_memory_per_mb: 0.0
  lambda_visual_tokens: 0.0001

router:
  feature_config_id: lowres_384
  hidden_dims: [128, 64]
  dropout: 0.1
  lr: 0.001
  epochs: 120
  batch_size: 32
  val_fraction: 0.2
  seed: 1234

datasets:
  seed: 1234
  shuffle_buffer_size: 5000
  image_dir: data/processed/docvqa1200/images
  per_dataset:
    docvqa: 1200
